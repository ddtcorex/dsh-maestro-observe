# dsh-maestro-observe bundle patch — debug tooling row (trace/health/cost).
# RPC channel: /dsh-maestro-observe (loopback, see src/host/index.ts)
- insert:
    - id: maestro-observe
      name: '@ddtcorex/dsh-maestro-observe'
      channel: /dsh-maestro-observe
      # rpc.handle registers a webServer route inside an effect fiber which
      # carries only the row's inject (not the module's); without webServer
      # the row fails on harnesses that provide webServer after rows apply (DSH 0.1.5-rc.1+).
      inject: ['tools', 'connection', 'webServer']
      config: {}
